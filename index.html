<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Web Design</title>
    <style>
        body {
            /* Фоновая картинка с крутой машиной */
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1614164185128-e4ec99c436d7?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.1); /* Эффект стекла */
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 45px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 350px;
        }

        h1 { color: #00ffaa; margin-bottom: 5px; }
        p { color: #ccc; margin-bottom: 25px; }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            box-sizing: border-box; /* Чтобы не вылазило за края */
        }

        button {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(45deg, #00ffaa, #00d4ff);
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
    box-shadow: 0 0 20px rgba(0, 255, 170, 0.6);
    transform: scale(1.02);
}ctive { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="card">
        <h1>Создание Сайтов</h1>
        <p>Премиальный дизайн и работающие формы</p>

        <form action="https://formspree.io/f/myklveeg" method="POST">
            <input type="text" name="name" placeholder="Как вас зовут?" required>
            <input type="email" name="email" placeholder="Ваш Email" required>
            <textarea name="message" placeholder="Какой проект обсудим?" rows="3"></textarea>
            <button type="submit">ЗАКАЗАТЬ САЙТ</button>
        </form>
    </div>

</body>
</html>
